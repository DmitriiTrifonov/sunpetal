# Builds and tests the runtime and the app on three systems, and checks that the Android library
# builds. There is no ROM in CI, so the game's recompiled code is not built here (the crates build
# without it); the self-tests that need it run on a developer's machine (docs/BUILD.md).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux packages (sound, pads)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - run: cargo build --workspace
      - run: cargo test --workspace
      # The GPU backend of the 3D (docs/GPU-BACKEND.md) compiles everywhere (the app turns it on, so
      # the workspace build above has it; this builds the runtime on its own with it). Its unit
      # tests skip themselves where there is no adapter, as on these machines; the parity tests
      # need the dumps and an adapter and run on a developer's machine.
      - run: cargo build -p sunpetal-runtime --features gpu
      - run: cargo test -p sunpetal-runtime --features gpu --lib

  # Стиль: fmt и clippy обязательны (K-114).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux packages (sound, pads)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The Python tools compile
        run: python -m compileall -q tools
      - name: The keys the tools work out agree with the runtime's (golden values)
        run: python tools/ds/test_nitro.py

  # Упаковка AppImage на x86_64 (K-057): ROM в CI нет, поэтому внутри приложение без модулей игры;
  # задача проверяет сам скрипт (сборка, образ, библиотеки), а играбельный образ игрок собирает у себя.
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux packages (sound, pads, file for appimagetool)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev file
      - run: tools/package/linux.sh
      - name: The image unpacks and every library of the binary is found
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE"/build/package/Sunpetal-x86_64.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun && test -f squashfs-root/sunpetal.desktop
          ! ldd squashfs-root/usr/bin/sunpetal-app | grep "not found"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: cargo install cargo-ndk --locked
      - name: The app builds as an Android library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          cargo ndk -t arm64-v8a -P 26 build --release -p sunpetal-app --lib
