[workspace]
resolver = "2"
members = ["crates/sunpetal-runtime", "crates/sunpetal-app"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"

# smaller binaries (the apk was 31 MB with symbols)
[profile.release]
strip = true

# the self-test replays thousands of functions with a crc32 of main RAM after each
[profile.test]
opt-level = 2
