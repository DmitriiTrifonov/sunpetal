[package]
name = "sunpetal-app"
description = "The window, the GPU and the sound device for the Sunpetal runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18.2"
dirs = "7.0.0"
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = "0.37.0"
egui-winit = "0.37.0"
gilrs = "0.11.2"
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
sunpetal-runtime = { path = "../sunpetal-runtime" }
sys-locale = "0.3.2"
toml = "1.1.8"
wgpu = "30.0.1"
winit = "0.30.13"
