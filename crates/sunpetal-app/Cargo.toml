[package]
name = "sunpetal-app"
description = "The window, the GPU and the sound device for the Sunpetal runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "sunpetal-app"
path = "src/main.rs"

[[bin]]
name = "sunpetal-screen-report"
path = "src/bin/sunpetal-screen-report.rs"

[lints]
workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18.2"
dirs = "7.0.0"
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = "0.37.0"
egui-winit = { version = "0.37.0", default-features = false, features = ["links", "wayland", "x11"] }
gilrs = "0.11.2"
pollster = "1.0.1"
png = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
sunpetal-runtime = { path = "../sunpetal-runtime", features = ["debug-tools", "gpu"] }
sunpetal-data = { path = "../sunpetal-data" }
sys-locale = "0.3.2"
toml = "1.1.8"
wgpu = "30.0.1"
winit = "0.30.13"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = "0.17.2"

# буфер обмена (arboard) не знает iOS и тянет Wayland: на iOS без него (K-057)
[target.'cfg(not(target_os = "ios"))'.dependencies]
egui-winit = { version = "0.37.0", features = ["clipboard"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSString", "NSProcessInfo"] }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", features = ["android-native-activity"] }
libc = "0.2"
android_log-sys = "0.3"

[dev-dependencies]
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in"] }
ab_glyph = "0.2.32"
