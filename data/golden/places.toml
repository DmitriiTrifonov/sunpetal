# Места золотых кадров (tools/auto/golden.py, К-225, А2.6): имя, куда идти, что делать, что снимать.
# goto: --goto Cnn_01 (начало главы на копии build/full100.sav); autoplay: --autoplay; steps: команды REPL до снимка
# (последняя команда снимка добавляется сама, снимок обоих экранов в масштабе 1). Ключ run — перед стартом нельзя
# менять данные: кадр должен быть воспроизводим (двух прогонов подряд хватает: хэши равны).

[[place]]
name = "c01_start"
goto = "C01_01"
steps = ["advance 120"]

