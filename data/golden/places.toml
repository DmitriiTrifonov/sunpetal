# свободная ходьба и меню ходьбы (маршруты скилла screen-recon)
[[place]]
name = "c02_walk"
goto = "C02_01"
autoplay = true
steps = ["skip 100", "advance 20"]

[[place]]
name = "c02_walk_menu"
goto = "C02_01"
autoplay = true
steps = ["skip 100", "advance 20", "press START 3", "advance 40"]

[[place]]
name = "c02_suitcase"
goto = "C02_01"
autoplay = true
steps = ["skip 100", "advance 20", "press START 3", "advance 40", "tap 25 43 4", "advance 100"]
